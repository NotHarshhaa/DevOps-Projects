name: CI

on:
  push:
    branches: [devops-project]
    paths:
      - "DevOps-Project-41/app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [devops-project, master]
    paths:
      - "DevOps-Project-41/app/**"

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  APP_DIR: DevOps-Project-41/app

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run tests
        run: dotnet test -c Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.APP_DIR }}/TestResults/*.trx

  docker-build:
    name: Docker Build (validation)
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          target: api
          push: false
          tags: ai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          target: worker
          push: false
          tags: ai-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
