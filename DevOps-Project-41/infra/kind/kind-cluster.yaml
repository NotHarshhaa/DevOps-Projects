kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-devsecops

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker

networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
