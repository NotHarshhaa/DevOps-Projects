apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: ai-devsecops
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: ai-worker
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
