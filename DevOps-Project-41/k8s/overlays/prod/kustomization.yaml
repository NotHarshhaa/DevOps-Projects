apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-devsecops

resources:
  - ../../base

patches:
  - path: api-deployment-patch.yaml
  - path: worker-deployment-patch.yaml

configMapGenerator:
  - name: ai-platform-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
    options:
      disableNameSuffixHash: true

# Production secrets must be created out-of-band before applying this overlay.
# Use External Secrets Operator or Sealed Secrets — never commit plain secrets to Git.
#
# kubectl -n ai-devsecops create secret generic postgres-secret \
#   --from-literal=password=STRONG_PASSWORD
#
# kubectl -n ai-devsecops create secret generic ai-platform-secrets \
#   --from-literal=POSTGRES_CONNECTION_STRING='Host=postgres;Database=aiops;Username=aiops;Password=STRONG_PASSWORD'

images:
  - name: ghcr.io/GITHUB_REPOSITORY/ai-api
    newTag: "1.0.0"
  - name: ghcr.io/GITHUB_REPOSITORY/ai-worker
    newTag: "1.0.0"
