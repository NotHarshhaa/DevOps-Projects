global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ai-api
    static_configs:
      - targets: ["ai-api:8080"]
    metrics_path: /metrics

  - job_name: ai-worker
    static_configs:
      - targets: ["ai-worker:9090"]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
